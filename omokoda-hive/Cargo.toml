[package]
name = "omokoda-hive"
version = "0.1.0"
edition = "2021"
description = "HiveBreath Protocol — Omokoda macro hive-mind state machine (H0–H8)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tokio-test = "0.4"
