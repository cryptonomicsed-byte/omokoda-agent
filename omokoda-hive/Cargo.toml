[package]
name = "omokoda-hive"
version = "0.1.0"
edition = "2021"
description = "HiveBreath Protocol — Omokoda macro hive-mind state machine (H0–H8)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
