[package]
name = "omokoda-hermetic"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
blake3 = "1.5"
hkdf = "0.12"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
# Reuses bipon39::Macro as the single Orisha type across the whole
# ecosystem instead of a second parallel enum -- pinned to the same rev
# Omo-Koda2's own identity derivation and Zangbeto's guardian use.
bipon39 = { git = "https://github.com/cryptonomicsed-byte/BIPON39", rev = "1c4d5c9" }
reqwest = { version = "0.11", features = ["json"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
