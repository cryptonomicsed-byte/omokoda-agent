[package]
name = "oso-agent-state-contract"
version = "0.1.0"
edition = "2021"

# Compiled to WASM for deployment as a Freenet contract.
# Build with: cargo build --target wasm32-unknown-unknown --release

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable when compiling to WASM for Freenet deployment.
contract = ["freenet-stdlib/contract"]

[dependencies]
freenet-stdlib = { version = "0.8.0", optional = true }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.10"
hex         = "0.4"
blake3      = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }

[dev-dependencies]
rand = "0.8"
