[package]
name = "omokoda-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nautilus_integration = { path = "../nautilus_integration" }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.8"
blake2 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
sha3 = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
chacha20poly1305 = "0.10"
hex = "0.4"
rand = "0.8"
wasm-bindgen = "0.2"
wasmtime = { version = "47", optional = true }
wasmtime-wasi = { version = "47", features = ["p1"], optional = true }
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["json", "macros"] }
tower-http = { version = "0.5", features = ["cors"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
reqwest = { version = "0.11", features = ["json", "stream", "blocking"] }
async-trait = "0.1"
urlencoding = "2.1"
ed25519-dalek = "2.0"
# Real crates (public). Pinned to the audited main commits; build against the
# actual BIPON39 / IfáScript behavior, not CI stubs (the former bipon39-stub /
# ifascript-stub mirrored only the API shape and have since been removed).
bipon39 = { git = "https://github.com/cryptonomicsed-byte/BIPON39", rev = "1c4d5c9" }
ifascript = { git = "https://github.com/cryptonomicsed-byte/If-Script", rev = "5dbee51fb2c637cda71e6702bada54b2c2dfc2c9" }
# Real LARQL-style graph queries (DESCRIBE/SELECT/WALK/INFER) over an
# agent's own sealed memory -- the lightweight glyph-graph adapter, not
# the full model-serving larql-server (needs multi-GB .vindex model data
# that doesn't exist anywhere in this stack; not deployed here for that
# reason). No plaintext is retained in the graph, only content-hash
# derived glyph/odù metadata -- see divination.rs.
larql-glyph = { git = "https://github.com/cryptonomicsed-byte/larql", rev = "149322efa11a2592b9cbebfbfa91c98d7b2d50a7" }
gix-core    = { path = "../../GIX/crates/gix-core" }
gix-types   = { path = "../../GIX/crates/gix-types" }
arp-types   = { path = "../../ARP/crates/arp-types" }
dip-types   = { path = "../../DIP/crates/dip-types" }
zangbeto-enforcement = { path = "../zangbeto-stub" }
nist_entropy = { path = "../nist_entropy" }
omokoda-mesh = { path = "../omokoda-mesh" }
omokoda-hermetic = { path = "../omokoda-hermetic" }
glob = "0.3"
walkdir = "2.3"
regex = "1.5"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "1.0"
prost = "0.14.3"
prost-derive = "0.14.3"
protobuf-codegen = "3.7.2"
serde_yaml = "0.9"
jsonschema = "0.17"
uuid = { version = "1.0", features = ["v4"] }
zip = "2"
log = "0.4"
libc = "0.2"
nostr = "0.44.4"
nostr-sdk = "0.44"
k256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
bech32 = "0.12.0"
bs58 = "0.5.1"
tracing = "0.1"
ripemd = "0.1"
bip32 = { version = "0.5.3", default-features = false, features = ["std", "k256", "secp256k1"] }

[features]
# "wasm" pulls in wasmtime + wasmtime-wasi (cranelift-codegen). Disabled by
# default on ARM64/Termux where cranelift's code-gen crashes rustc at compile
# time (SIGSEGV — known upstream ARM64 stack-overflow bug). Enable explicitly
# on x86_64 production nodes: `cargo build --features wasm`.
default = []
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dev-dependencies]
criterion = "0.5"
httpmock = "0.6"
tempfile = "3.0"
wat = "1.0"

[build-dependencies]
prost-build = "0.14.3"
protoc-bin-vendored = "3.2.0"
