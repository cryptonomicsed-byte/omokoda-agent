[package]
name = "freenet-agent-state"
version = "0.1.0"
edition = "2021"
description = "Freenet WASM contract for OSO agent public state replication — Phase 17.1"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
freenet-stdlib = { version = "0.12.0", optional = true, features = [] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
blake3      = "1"
hex         = "0.4"

[features]
default = []
# Enable when compiling for Freenet node deployment
contract = ["dep:freenet-stdlib", "freenet-stdlib/contract"]

[profile.release]
opt-level = "s"
lto = true
