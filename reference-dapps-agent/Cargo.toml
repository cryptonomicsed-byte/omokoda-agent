[package]
name = "reference-dapps-agent"
version = "0.1.0"
edition = "2021"
description = "Phase 27 — Rust agent backends for the three Ọ̀ṢỌ́ reference dApps"

[[bin]]
name = "dapp-backend"
path = "src/main.rs"

[dependencies]
oso-ir       = { path = "../oso-ir" }
oso-compiler = { path = "../oso-compiler" }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
clap         = { version = "4", features = ["derive"] }
